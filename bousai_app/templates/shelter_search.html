{% extends "base.html" %}

{% block title %}避難所検索 - 防災アプリ{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  .shelter-search-page h2 { margin-bottom: 8px; }
  .shelter-search-form { padding: 24px; border: 1px solid #e1e7ee; border-radius: 18px; background: #fff; box-shadow: 0 5px 20px rgba(55, 81, 112, .08); }
  .shelter-search-form h3 { margin-top: 0; }
  .shelter-search-form select { width: 100%; max-width: 360px; margin: 8px 0 18px; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
  .shelter-search-map { height: 320px; margin: 20px 0; border: 1px solid #cbd5e1; border-radius: 12px; background: #e2e8f0; }
  .condition-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0 22px; }
  .condition-list label { display: block; padding: 13px 14px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  .condition-list input { width: auto; margin-right: 8px; }
  .shelter-search-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .shelter-search-links a { display: inline-flex; min-height: 42px; align-items: center; padding: 10px 18px; border-radius: 7px; color: #fff; background: #2e5eae; text-decoration: none; }
  @media (max-width: 640px) { .shelter-search-form { padding: 18px; border-radius: 14px; } .condition-list { grid-template-columns: 1fr; } }
</style>

<section class="shelter-search-page">
  <h2>避難所検索</h2>
  <p>登録済みの避難所を支援条件から検索できます。</p>
  <div id="shelter-search-map" class="shelter-search-map" aria-label="現在地と避難所の地図"></div>
  <form class="shelter-search-form" method="post" action="{{ url_for('search_results') }}">
    <h3>支援条件から検索</h3>
    <p>該当する項目にチェックを入れて検索してください。</p>
    <div class="condition-list">
      <label><input type="checkbox" name="pregnant">🤰 妊婦</label>
      <label><input type="checkbox" name="wheelchair">♿ 車いす利用者</label>
      <label><input type="checkbox" name="pet">🐾 ペット同伴</label>
      <label><input type="checkbox" name="disability">🤝 障がいのある方</label>
    </div>
    <button type="submit">条件検索</button>
  </form>
  <!-- <div class="shelter-search-links"><a href="{{ url_for('all_shelters') }}">全施設一覧を見る</a></div> -->
</section>
<script id="shelter-search-data" type="application/json">{{ {'location': current_location, 'shelters': shelters}|tojson|safe }}</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const data = JSON.parse(document.getElementById('shelter-search-data').textContent);
  const map = L.map('shelter-search-map').setView([data.location.lat, data.location.lng], 13);
  L.tileLayer('/api/map-tiles/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer">国土地理院</a>'
  }).addTo(map);
  L.circleMarker([data.location.lat, data.location.lng], {
    radius: 9, color: '#1d4ed8', fillColor: '#3b82f6', fillOpacity: .85, weight: 3
  }).addTo(map).bindPopup('<b>現在地</b><br>' + data.location.address);
  data.shelters.forEach(function (shelter) {
    const latitude = shelter.latitude ?? shelter.lat;
    const longitude = shelter.longitude ?? shelter.lng;
    if (latitude === undefined || longitude === undefined) return;
    L.marker([latitude, longitude]).addTo(map).bindPopup('<b>' + shelter.name + '</b><br>' + (shelter.address || '住所未登録'));
  });
});
</script>
{% endblock %}
